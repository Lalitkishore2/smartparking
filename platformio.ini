[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Speed (matches your Serial.begin(115200))
monitor_speed = 115200

; Upload Speed
upload_speed = 921600

; Required Libraries
lib_deps =
    arduino-libraries/LiquidCrystal @ ^1.0.7
    madhephaestus/ESP32Servo @ ^0.13.0
    miguelbalboa/MFRC522 @ ^1.4.11
    bblanchon/ArduinoJson @ ^6.21.3

; Build flags (optional but recommended for ESP32)
build_flags =
    -DCORE_DEBUG_LEVEL=0
